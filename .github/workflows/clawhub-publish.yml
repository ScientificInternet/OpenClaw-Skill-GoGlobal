name: Publish to ClawHub
on:
  push:
    branches: [main]
    paths:
      - 'SKILL.md'
      - 'prompt.md'
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install ClawHub CLI
        run: npm install -g clawhub@latest

      - name: Login
        run: clawhub login --token "${{ secrets.CLAWHUB_TOKEN }}"

      - name: Publish skill
        run: |
          set -o pipefail

          VERSION=$(grep '^version:' SKILL.md | head -1 | awk '{print $2}' | tr -d '"' | tr -d "'")
          NAME=$(grep '^name:' SKILL.md | head -1 | awk '{print $2}' | tr -d '"' | tr -d "'")

          if [ -z "$VERSION" ] || [ -z "$NAME" ]; then
            echo ">>> Could not extract name/version from SKILL.md"
            exit 1
          fi

          echo ">>> Publishing $NAME@$VERSION"

          if ! clawhub publish . \
              --slug "$NAME" \
              --name "$NAME" \
              --version "$VERSION" \
              --changelog "Auto-published from GitHub commit ${{ github.sha }}" \
              2>&1 | tee /tmp/publish.log; then

            if grep -qiE "already exists|version exists|duplicate" /tmp/publish.log; then
              echo ">>> Version $VERSION already published — skipping (idempotent)"
              exit 0
            fi

            echo ">>> Publish FAILED. Likely causes:"
            echo ">>>   - CLAWHUB_TOKEN secret expired or invalid"
            echo ">>>   - New version awaiting NVIDIA SkillSpector re-audit"
            echo ">>>   - clawhub CLI version mismatch with server schema"
            echo ">>> Check ClawHub dashboard: https://clawhub.ai/scientificinternet"
            exit 1
          fi

          echo ">>> Successfully published $NAME@$VERSION"
